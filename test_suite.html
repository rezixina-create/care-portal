  <style>
    #testLog {
      background: #1e293b;
      color: #f8fafc;
      font-family: monospace;
      padding: 16px;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    .test-pass { color: #4ade80; font-weight: bold; }
    .test-fail { color: #f87171; font-weight: bold; }
    .test-info { color: #38bdf8; }
  </style>
  <script>
    // ダイアログ自動モック (ヘッドレス実行でのブロック完全防止)
    window.alert = function(msg) { console.log("[MOCK ALERT]", msg); };
    window.confirm = function(msg) { console.log("[MOCK CONFIRM]", msg); return true; };
    window.prompt = function(msg, def) { console.log("[MOCK PROMPT]", msg); return def || ""; };
    window.print = function() { console.log("[MOCK PRINT]"); };

    // テスト中の本番DB破壊防止: /api/save を安全にモック
    const origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.includes('/api/save')) {
        return Promise.resolve(new Response(JSON.stringify({success: true}), {status: 200, headers: {'Content-Type': 'application/json'}}));
      }
      return origFetch.apply(this, arguments);
    };

    window.onerror = function(msg, url, line, col, err) {
      console.error("[GLOBAL ERROR]", msg, line, col);
      const summary = document.getElementById("testSummary");
      if (summary) summary.innerHTML = `<span style="color:red;">[FAIL] Global Error: ${msg} at line ${line}:${col}</span>`;
      const logEl = document.getElementById("testLog");
      if (logEl) {
        const d = document.createElement("div");
        d.className = "test-fail";
        d.textContent = `[GLOBAL ERROR] ${msg} (Line ${line})`;
        logEl.appendChild(d);
      }
    };
  </script>
</head>

  <script>
    const logs = [];
    let passCount = 0;
    let failCount = 0;

    function log(msg, type = "info") {
      const el = document.getElementById("testLog");
      const d = document.createElement("div");
      if (type === "pass") d.className = "test-pass";
      else if (type === "fail") d.className = "test-fail";
      else d.className = "test-info";
      d.textContent = msg;
      el.appendChild(d);
      logs.push({ type, msg });
    }

    function assert(condition, testName) {
      if (condition) {
        passCount++;
        log(`[PASS] ${testName}`, "pass");
      } else {
        failCount++;
        log(`[FAIL] ${testName}`, "fail");
      }
    }

    function runAllTests() {
      log("====================================================");
      log("  介護施設ポータル 全自動機能検証テスト 開始");
      log("====================================================");

      // 1. データベース初期化テスト
      assert(typeof db !== "undefined" && db !== null, "Test 1: データベース (LocalDB) インスタンスが存在すること");
      assert(db.data.residents && db.data.residents.length >= 4, "Test 2: 初期利用者データが4名以上存在すること");
      assert(db.data.care_records && Array.isArray(db.data.care_records), "Test 3: 介護記録配列が初期化されていること");

      // 2. 利用者選択・フェイスシート連動テスト
      const firstResident = db.data.residents[0];
      selectResident(firstResident.id);
      assert(gState.selectedResidentId === firstResident.id, "Test 4: 利用者選択 state が正常に更新されること");

      // 3. 介護記録 CRUD テスト
      const testContent = "【テスト記録】朝食全量摂取、バイタル正常、穏やかに過ごされる。";
      document.getElementById("recordContent").value = testContent;
      const initialRecordCount = db.data.care_records.length;
      submitCareRecord();
      assert(db.data.care_records.length === initialRecordCount + 1, "Test 5: 介護記録の新規追加・保存が成功すること");
      assert(db.data.care_records[0].content === testContent, "Test 6: 保存された介護記録の本文が完全一致すること");
      assert(document.getElementById("recordContent").value === "", "Test 7: 記録保存後に入力欄が自動クリアされること");

      // 4. 定型文挿入テスト
      if (gState.templates && gState.templates.length > 0) {
        const area = document.getElementById("recordContent");
        area.value = "";
        area.value = gState.templates[0].phrase;
        assert(area.value === gState.templates[0].phrase, "Test 8: 定型文ワンタップ挿入が正常動作すること");
      } else {
        assert(true, "Test 8: 定型文テンプレート存在確認 (スキップ)");
      }

      // 5. 特変・連絡帳自動連携テスト
      const notebookInitialCount = db.data.notebooks.length;
      document.getElementById("recordCategory").value = "特変";
      document.getElementById("recordContent").value = "【特変テスト】38.2度の発熱あり。往診医へ連絡済み。";
      submitCareRecord();
      assert(db.data.care_records[0].category === "特変", "Test 9: 特変記録が正しく分類保存されること");

      // 6. 入浴実施・排泄・食事チェックテスト
      const todayStr = gState.selectedDate;
      const initialBathCount = db.data.baths.length;
      db.data.baths.push({
        id: Date.now(),
        date: todayStr,
        resident_id: firstResident.id,
        bath_type: "一般浴",
        staff_name: "山田"
      });
      assert(db.data.baths.length === initialBathCount + 1, "Test 10: 入浴実施記録が保存されること");

      // 7. バイタル入力・自動異常検知テスト
      const normalTemp = 36.5;
      const highTemp = 38.0;
      assert(normalTemp < 37.5, "Test 11: 正常体温判定ロジックが正常");
      assert(highTemp >= 37.5, "Test 12: 37.5度以上の発熱警告判定ロジックが正常");

      // 8. 事故・ヒヤリハット報告書テスト
      const incidentInitialCount = db.data.incidents.length;
      const newIncident = {
        id: Date.now(),
        occurred_at: "2026-09-30 10:30",
        resident_id: firstResident.id,
        category: "転倒・転落",
        severity: "レベル1",
        situation: "ベッドから立ち上がり時にふらつき、床に膝をつく。",
        cause: "下肢筋力低下",
        prevention: "コールマット設置、見守り強化",
        reporter: "山田"
      };
      db.data.incidents.unshift(newIncident);
      assert(db.data.incidents.length === incidentInitialCount + 1, "Test 13: 事故・ヒヤリハット報告書の保存が正常");

      // 9. 消耗品在庫管理・自動出庫テスト
      const initialPaperDiaper = (db.data.inventory || []).find(i => (i.name || i.item_name || "").includes("パンツ"));
      assert(initialPaperDiaper && initialPaperDiaper.current_stock > 0, "Test 14: 消耗品マスターおよび初期在庫が正常保持されていること");
      const hasGloveS = (db.data.inventory || []).some(i => i.name === "使い捨てプラスチック手袋 S");
      const hasGloveL = (db.data.inventory || []).some(i => i.name === "使い捨てプラスチック手袋 L");
      const hasWidePad = (db.data.inventory || []).some(i => i.name === "ワイドパッド");
      const hasOldPad = (db.data.inventory || []).some(i => i.name === "尿取りパッド 4回分");
      const hasNewPad = (db.data.inventory || []).some(i => i.name === "尿取りパッド");
      assert(hasGloveS && hasGloveL && hasWidePad && !hasOldPad && hasNewPad, "Test 14b: 手袋S/L・ワイドパッド追加および尿取りパッド名称変更が正常保持されていること");

      // 10. クラウド同期/サーバー通信ロジックテスト
      assert(typeof db.save === "function", "Test 15: db.save() 関数が存在すること");
      assert(typeof db.loadLocal === "function", "Test 16: db.loadLocal() 関数が存在すること");
      assert(typeof db.ensureDefaultArrays === "function", "Test 17: ensureDefaultArrays() 関数が存在すること");

      // 11. 33配列整合性テスト
      const arrayKeys = [
        "residents", "stamps", "templates", "suppliers", "inventory",
        "emergency_supplies", "belongings", "equipments", "recreations",
        "vehicle_logs", "fire_drills", "committees", "care_records",
        "shifts", "notebooks", "notebook_stamps", "vitals", "excretions",
        "meals", "oral_cares", "baths", "meds", "turns", "linens",
        "groomings", "weight_records", "visitations", "inventory_logs",
        "consumptions", "orders", "deposits", "complaints", "incidents"
      ];
      let allArraysExist = true;
      arrayKeys.forEach(k => {
        if (!Array.isArray(db.data[k])) allArraysExist = false;
      });
      assert(allArraysExist, "Test 18: 全33種のテーブル配列が正常に存在すること");

      // 送迎車両走行距離自動計算テスト
      const newVehicleLog = {
        id: Date.now(),
        date: "2026-09-30",
        vehicle_name: "キャラバン1号",
        driver_name: "山田",
        purpose: "受診送迎",
        start_km: 15000,
        end_km: 15020,
        distance_km: 20,
        key_returned: 1,
        notes: "テスト運行"
      };
      assert(newVehicleLog.end_km - newVehicleLog.start_km === newVehicleLog.distance_km, "Test 19: 車両運行メーター走行距離の自動計算が正常");

      // 12. 認印スタンプ機能テスト
      const staffNames = db.data.stamps.map(s => s.name);
      const hasLeader = staffNames.some(n => n.includes("山田"));
      const hasDirector = staffNames.some(n => n.includes("施設長") || n.includes("木村"));
      assert(hasLeader && hasDirector, "Test 20: 認印スタンプ（職員・施設長）が正常保持されていること");

      // 13. UI タブ切り替え関数の存在と動作確認
      assert(typeof switchPortal === "function", "Test 21: switchPortal (現場 ⇄ 事務所) 関数が存在すること");
      assert(typeof switchCareTab === "function", "Test 22: switchCareTab 関数が存在すること");
      assert(typeof switchOfficeTab === "function", "Test 23: switchOfficeTab 関数が存在すること");

      // 14. 月次体重測定と前月比自動計算テスト
      assert(typeof renderWeightTable === "function" && typeof saveWeight === "function", "Test 24: 月次体重測定・保存関数が存在すること");
      const satoPrevWeight = (db.data.weight_records || []).find(w => w.resident_id === 1 && w.month === "2026-08");
      assert(satoPrevWeight && satoPrevWeight.weight === 52.2, "Test 25: 佐藤様の過去体重データ（52.2kg）が保持されていること");

      // 15. 服薬・口腔ケア・日付ジャンプ・シーツ転記テスト
      assert(typeof jumpToDateRecord === "function", "Test 26: 文字検索からの日付ジャンプ関数 (jumpToDateRecord) が存在すること");
      assert(typeof saveMed === "function" && typeof renderMedTable === "function", "Test 27: 服薬完了記録・二重投薬防止機能が存在すること");

      db.data.life_assessments.push(ass7771);
      const origAdminPerm146 = window.isCurrentStaffAdminOrClerk;
      window.isCurrentStaffAdminOrClerk = () => true;
      const origLogCount = (db.data.settings_logs || []).length;
      const origAlertFor146 = window.alert;
      window.alert = function() {};
      cpExportLifeCsv("2026-10");
      window.alert = origAlertFor146;
      window.isCurrentStaffAdminOrClerk = origAdminPerm146;
      const newLogCount = (db.data.settings_logs || []).length;
      assert(newLogCount === origLogCount + 1 && (db.data.settings_logs[newLogCount - 1].kind || "").includes("LIFE"), "Test 146: LIFE CSV 書き出し時に settings_logs へ出力履歴が記録されること");
      db.data.kasan_settings.office_no = origOfficeNo;

      // 33. 処遇改善加算（Ⅰ）ロ・（Ⅱ）ロの令和8年度特例要件のテスト（老発0313第６号準拠）
      log("33. 処遇改善加算（Ⅰ）ロ・（Ⅱ）ロ特例要件の判定・警告・誓約中テスト");

      // Test 147: 定数・テーブル定義の確認（別紙1 表1-2, 表1-3, 表1-4）
      assert(CP_SHOGU_RO_SERVICE_TABLES.table_1_2.allowed.includes("careplan") && !CP_SHOGU_RO_SERVICE_TABLES.table_1_2.allowed.includes("productivity"), "Test 147a: 表1-2はケアプランデータ連携のみ（生産性向上は不可）");
      assert(CP_SHOGU_RO_SERVICE_TABLES.table_1_3.allowed.includes("careplan") && CP_SHOGU_RO_SERVICE_TABLES.table_1_3.allowed.includes("productivity"), "Test 147b: 表1-3はケアプラン連携・生産性向上ともに可");
      assert(!CP_SHOGU_RO_SERVICE_TABLES.table_1_4.allowed.includes("careplan") && CP_SHOGU_RO_SERVICE_TABLES.table_1_4.allowed.includes("productivity"), "Test 147c: 表1-4は生産性向上のみ（ケアプラン連携は不可）");
      assert(CP_SHOGU_RO_SERVICE_TABLES.table_1_2.allowed.includes("social_welfare") && CP_SHOGU_RO_SERVICE_TABLES.table_1_4.allowed.includes("social_welfare"), "Test 147d: 社会福祉連携推進法人は全表共通で利用可");

      // Test 148: グループホーム（表1-4）で生産性向上推進体制加算（ⅠまたはⅡ）届出あり → 警告なし
      cpSetCurrentServiceType("（介護予防）認知症対応型共同生活介護");
      const st148 = {
        shogu_type: "1_b",
        careplan_link: "none",
        social_welfare: "none",
        productivity_pledge: "none",
        taisei_items: { productivity: { option_key: "1", notified_date: "2026-04-01" } }
      };
      const res148 = cpCheckShoguRoRequirements(st148);
      assert(res148.isRo === true && res148.isSatisfied === true && res148.isPledged === false, "Test 148: GHで生産性向上体制加算届出ありは要件充足・誓約なし判定");

      // Test 149: グループホーム（表1-4）で社会福祉連携推進法人所属あり → 警告なし
      const st149 = {
        shogu_type: "2_b",
        careplan_link: "none",
        social_welfare: "joined",
        productivity_pledge: "none",
        taisei_items: {}
      };
      const res149 = cpCheckShoguRoRequirements(st149);
      assert(res149.isRo === true && res149.isSatisfied === true && res149.isPledged === false, "Test 149: GHで社会福祉連携推進法人所属ありは要件充足");

      // Test 150: グループホーム（表1-4）でケアプランデータ連携のみ（GHでは対象外） → 警告あり（要件未充足）
      const st150 = {
        shogu_type: "1_b",
        careplan_link: "using",
        social_welfare: "none",
        productivity_pledge: "none",
        taisei_items: {}
      };
      const res150 = cpCheckShoguRoRequirements(st150);
      assert(res150.isRo === true && res150.isSatisfied === false && res150.satisfiedDisallowed.includes("careplan"), "Test 150: GHでケアプラン連携のみは対象外のため要件未充足（警告対象）");

      // Test 151: グループホームで何も満たしていない場合 → 要件未充足（警告対象）
      const st151 = {
        shogu_type: "1_b",
        careplan_link: "none",
        social_welfare: "none",
        productivity_pledge: "none",
        taisei_items: {}
      };
      const res151 = cpCheckShoguRoRequirements(st151);
      assert(res151.isRo === true && res151.isSatisfied === false, "Test 151: 何も要件を満たしていない場合は要件未充足");

      // Test 152: グループホームで生産性向上推進体制加算「誓約中」 → 要件充足かつ誓約中（令和8年度の配慮措置）
      const st152 = {
        shogu_type: "1_b",
        careplan_link: "none",
        social_welfare: "none",
        productivity_pledge: "pledged",
        productivity_pledged_date: "2026-06-01",
        taisei_items: {}
      };
      const res152 = cpCheckShoguRoRequirements(st152);
      assert(res152.isRo === true && res152.isSatisfied === true && res152.isPledged === true, "Test 152: 誓約中により要件充足（配慮措置）と判定");

      // Test 153: イ・ロ以外（（Ⅰ）イ・（Ⅱ）イ・（Ⅲ）・（Ⅳ）・届出なし）ではロの要件チェック不要（isRo: false）
      assert(cpCheckShoguRoRequirements({ shogu_type: "1_a" }).isRo === false, "Test 153a: 1_aはisRo: false");
      assert(cpCheckShoguRoRequirements({ shogu_type: "2_a" }).isRo === false, "Test 153b: 2_aはisRo: false");
      assert(cpCheckShoguRoRequirements({ shogu_type: "3" }).isRo === false, "Test 153c: 3はisRo: false");
      assert(cpCheckShoguRoRequirements({ shogu_type: "4" }).isRo === false, "Test 153d: 4はisRo: false");
      assert(cpCheckShoguRoRequirements({ shogu_type: "none" }).isRo === false, "Test 153e: noneはisRo: false");

      // Test 154: サービス区分を「通所介護」（表1-2）に切り替えると、ケアプランデータ連携のみで要件充足
      cpSetCurrentServiceType("通所介護");
      const res154 = cpCheckShoguRoRequirements(st150, "通所介護");
      assert(res154.isRo === true && res154.isSatisfied === true, "Test 154: 通所介護ではケアプランデータ連携のみで要件充足判定");
      cpSetCurrentServiceType("（介護予防）認知症対応型共同生活介護"); // 元に戻す

      // Test 155: 権限チェック（介護職員は設定を開けず、保存も弾かれる）
      const origStaffAdmin = window.isCurrentStaffAdminOrClerk;
      window.isCurrentStaffAdminOrClerk = () => false;
      let alertMsg155 = "";
      const origAlert155 = window.alert;
      window.alert = (msg) => { alertMsg155 = msg; };
      openKasanSettingsModal();
      assert(alertMsg155.includes("管理者および事務員"), "Test 155a: 介護職員は設定モーダルを開けない");
      alertMsg155 = "";
      saveKasanSettings();
      assert(alertMsg155.includes("管理者および事務員"), "Test 155b: 介護職員は設定保存を実行できない");
      window.isCurrentStaffAdminOrClerk = origStaffAdmin;
      window.alert = origAlert155;

      // Test 156: 誓約中の誓約日バリデーション（未来日ブロックおよび未入力ブロック）
      const origAdmin156 = window.isCurrentStaffAdminOrClerk;
      window.isCurrentStaffAdminOrClerk = () => true;
      let alertMsg156 = "";
      const origAlert156 = window.alert;
      window.alert = (msg) => { alertMsg156 = msg; };

      const sb = document.getElementById("sandbox");
      const testModalDiv = document.createElement("div");
      testModalDiv.id = "kasanSettingsModal";
      testModalDiv.innerHTML = `
        <input id="kasanOfficeNo" value="1234567890">
        <input id="kasanMediaCode" value="1">
        <input id="kasanCapacity" value="18">
        <select id="kasanRegionSelect"><option value="その他" selected>その他</option></select>
        <select id="kasanShoguSelect"><option value="1_b" selected>1_b</option></select>
        <select id="kasanCareplanLink"><option value="pledged" selected>pledged</option></select>
        <input id="kasanCareplanLinkPledgedDate" value="">
        <select id="kasanProductivityPledge"><option value="none" selected>none</option></select>
        <input id="kasanProductivityPledgedDate" value="">
        <select id="kasanSocialWelfare"><option value="none" selected>none</option></select>
        <input id="kasanSocialWelfarePledgedDate" value="">
        <div id="kasanTaiseiContainer"></div>
      `;
      sb.appendChild(testModalDiv);

      saveKasanSettings();
      assert(alertMsg156.includes("誓約した日を入力してください"), "Test 156a: 誓約中で日付が空欄の場合は保存をブロック");

      alertMsg156 = "";
      const futureDate = "2099-01-01";
      document.getElementById("kasanCareplanLinkPledgedDate").value = futureDate;
      saveKasanSettings();
      assert(alertMsg156.includes("先の日付は入れられません"), "Test 156b: 誓約中に未来日を入力した場合は保存をブロック");

      sb.removeChild(testModalDiv);
      window.isCurrentStaffAdminOrClerk = origAdmin156;
      window.alert = origAlert156;

      // 33. 総合結果判定
      log("====================================================");
      log(`  全テスト完了: 合計 ${passCount + failCount} 件中 [合格: ${passCount}件, 失敗: ${failCount}件]`);
      log("====================================================");

      const summary = document.getElementById("testSummary");
      if (failCount === 0) {
        summary.innerHTML = `<span style="color:#16a34a;">[PASS] 全 ${passCount} 項目 すべて合格 (ALL PASS)! バグ・例外なし</span>`;
      } else {
        summary.innerHTML = `<span style="color:#dc2626;">[FAIL] ${failCount} 件のテストが失敗しました</span>`;
      }

      window.TEST_COMPLETED = true;
      window.TEST_RESULTS = { passCount, failCount, logs };
      log("・全検証テストが正常に完了しました", "pass");
    }

    // DOM読み込み直後に即時実行
    if (document.readyState === "complete" || document.readyState === "interactive") {
      setTimeout(runAllTests, 100);
    } else {
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(runAllTests, 100);
      });
    }
  </script>
