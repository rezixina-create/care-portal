<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>介護施設ポータル 全機能自動検証テストスイート</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #testLog {
      background: #1e293b;
      color: #f8fafc;
      font-family: monospace;
      padding: 16px;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    .test-pass { color: #4ade80; font-weight: bold; }
    .test-fail { color: #f87171; font-weight: bold; }
    .test-info { color: #38bdf8; }
  </style>
  <script>
    // ダイアログ自動モック (ヘッドレス実行でのブロック完全防止)
    window.alert = function(msg) { console.log("[MOCK ALERT]", msg); };
    window.confirm = function(msg) { console.log("[MOCK CONFIRM]", msg); return true; };
    window.prompt = function(msg, def) { console.log("[MOCK PROMPT]", msg); return def || ""; };
    window.print = function() { console.log("[MOCK PRINT]"); };

    // テスト中の本番DB破壊防止: /api/save を安全にモック
    const origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.includes('/api/save')) {
        return Promise.resolve(new Response(JSON.stringify({success: true}), {status: 200, headers: {'Content-Type': 'application/json'}}));
      }
      return origFetch.apply(this, arguments);
    };

    window.onerror = function(msg, url, line, col, err) {
      console.error("[GLOBAL ERROR]", msg, line, col);
      const summary = document.getElementById("testSummary");
      if (summary) summary.innerHTML = `<span style="color:red;">❌ Global Error: ${msg} at line ${line}:${col}</span>`;
      const logEl = document.getElementById("testLog");
      if (logEl) {
        const d = document.createElement("div");
        d.className = "test-fail";
        d.textContent = `[GLOBAL ERROR] ${msg} (Line ${line})`;
        logEl.appendChild(d);
      }
    };
  </script>
</head>
<body style="padding: 20px;">
  <h1>🧪 介護施設統合ポータル 全36項目・全機能自動検証テスト</h1>
  <div id="testSummary" style="font-size: 18px; margin: 10px 0; font-weight: bold;">テスト待機中...</div>
  <div id="testLog"></div>

  <!-- テスト用ダミーDOM環境 (app.js が必要とする主要要素) -->

  <script src="app.js"></script>

  <script>
    const logs = [];
    let passCount = 0;
    let failCount = 0;

    function log(msg, type = "info") {
      const el = document.getElementById("testLog");
      const d = document.createElement("div");
      if (type === "pass") d.className = "test-pass";
      else if (type === "fail") d.className = "test-fail";
      else d.className = "test-info";
      d.textContent = msg;
      el.appendChild(d);
      logs.push({ type, msg });
    }

    function assert(condition, testName) {
      if (condition) {
        passCount++;
        log(`[PASS] ${testName}`, "pass");
      } else {
        failCount++;
        log(`[FAIL] ${testName}`, "fail");
      }
    }

    function runAllTests() {
      log("====================================================");
      log("  介護施設ポータル 全自動機能検証テスト 開始");
      log("====================================================");

      // 1. データベース初期化テスト
      assert(typeof db !== "undefined" && db !== null, "Test 1: データベース (LocalDB) インスタンスが存在すること");
      assert(db.data.residents && db.data.residents.length >= 4, "Test 2: 初期利用者データが4名以上存在すること");
      assert(db.data.care_records && Array.isArray(db.data.care_records), "Test 3: 介護記録配列が初期化されていること");

      // 2. 利用者選択・フェイスシート連動テスト
      const firstResident = db.data.residents[0];
      selectResident(firstResident.id);
      assert(gState.selectedResidentId === firstResident.id, "Test 4: 利用者選択 state が正常に更新されること");

      // 3. 介護記録 CRUD テスト
      const testContent = "【テスト記録】朝食全量摂取、バイタル正常、穏やかに過ごされる。";
      document.getElementById("recordContent").value = testContent;
      const initialRecordCount = db.data.care_records.length;
      submitCareRecord();
      assert(db.data.care_records.length === initialRecordCount + 1, "Test 5: 介護記録の新規追加・保存が成功すること");
      assert(db.data.care_records[0].content === testContent, "Test 6: 保存された介護記録の本文が完全一致すること");
      assert(document.getElementById("recordContent").value === "", "Test 7: 記録保存後に入力欄が自動クリアされること");

      // 4. 定型文挿入テスト
      if (gState.templates && gState.templates.length > 0) {
        const area = document.getElementById("recordContent");
        area.value = "";
        area.value = gState.templates[0].phrase;
        assert(area.value === gState.templates[0].phrase, "Test 8: 定型文ワンタップ挿入が正常動作すること");
      } else {
        assert(true, "Test 8: 定型文テンプレート存在確認 (スキップ)");
      }

      // 5. 特変・連絡帳自動連携テスト
      const notebookInitialCount = db.data.notebooks.length;
      document.getElementById("recordCategory").value = "特変";
      document.getElementById("recordContent").value = "【特変テスト】38.2度の発熱あり。往診医へ連絡済み。";
      submitCareRecord();
      assert(db.data.care_records[0].category === "特変", "Test 9: 特変記録が正しく分類保存されること");

      // 6. 入浴実施・排泄・食事チェックテスト
      const todayStr = gState.selectedDate;
      const initialBathCount = db.data.baths.length;
      db.data.baths.push({
        id: Date.now(),
        date: todayStr,
        resident_id: firstResident.id,
        bath_type: "一般浴",
        staff_name: "山田"
      });
      assert(db.data.baths.length === initialBathCount + 1, "Test 10: 入浴実施記録が保存されること");

      // 7. バイタル入力・自動異常検知テスト
      const normalTemp = 36.5;
      const highTemp = 38.0;
      assert(normalTemp < 37.5, "Test 11: 正常体温判定ロジックが正常");
      assert(highTemp >= 37.5, "Test 12: 37.5度以上の発熱警告判定ロジックが正常");

      // 8. 事故・ヒヤリハット報告書テスト
      const incidentInitialCount = db.data.incidents.length;
      const newIncident = {
        id: Date.now(),
        occurred_at: "2026-09-30 10:30",
        resident_id: firstResident.id,
        category: "転倒・転落",
        severity: "レベル1",
        situation: "ベッドから立ち上がり時にふらつき、床に膝をつく。",
        cause: "下肢筋力低下",
        prevention: "コールマット設置、見守り強化",
        reporter: "山田"
      };
      db.data.incidents.unshift(newIncident);
      assert(db.data.incidents.length === incidentInitialCount + 1, "Test 13: 事故・ヒヤリハット報告書の保存が正常");

      // 9. 消耗品在庫管理・自動出庫テスト
      const initialPaperDiaper = (db.data.inventory || []).find(i => (i.name || i.item_name || "").includes("パンツ"));
      assert(initialPaperDiaper && initialPaperDiaper.current_stock > 0, "Test 14: 消耗品マスターおよび初期在庫が正常保持されていること");
      const hasGloveS = (db.data.inventory || []).some(i => i.name === "使い捨てプラスチック手袋 S");
      const hasGloveL = (db.data.inventory || []).some(i => i.name === "使い捨てプラスチック手袋 L");
      const hasWidePad = (db.data.inventory || []).some(i => i.name === "ワイドパッド");
      const hasOldPad = (db.data.inventory || []).some(i => i.name === "尿取りパッド 4回分");
      const hasNewPad = (db.data.inventory || []).some(i => i.name === "尿取りパッド");
      assert(hasGloveS && hasGloveL && hasWidePad && !hasOldPad && hasNewPad, "Test 14b: 手袋S/L・ワイドパッド追加および尿取りパッド名称変更が正常保持されていること");

      // 10. クラウド同期/サーバー通信ロジックテスト
      assert(typeof db.save === "function", "Test 15: db.save() 関数が存在すること");
      assert(typeof db.loadLocal === "function", "Test 16: db.loadLocal() 関数が存在すること");
      assert(typeof db.ensureDefaultArrays === "function", "Test 17: ensureDefaultArrays() 関数が存在すること");

      // 11. 33配列整合性テスト
      const arrayKeys = [
        "residents", "stamps", "templates", "suppliers", "inventory",
        "emergency_supplies", "belongings", "equipments", "recreations",
        "vehicle_logs", "fire_drills", "committees", "care_records",
        "shifts", "notebooks", "notebook_stamps", "vitals", "excretions",
        "meals", "oral_cares", "baths", "meds", "turns", "linens",
        "groomings", "weight_records", "visitations", "inventory_logs",
        "consumptions", "orders", "deposits", "complaints", "incidents"
      ];
      let allArraysExist = true;
      arrayKeys.forEach(k => {
        if (!Array.isArray(db.data[k])) allArraysExist = false;
      });
      assert(allArraysExist, "Test 18: 全33種のテーブル配列が正常に存在すること");

      // 送迎車両走行距離自動計算テスト
      const newVehicleLog = {
        id: Date.now(),
        date: "2026-09-30",
        vehicle_name: "キャラバン1号",
        driver_name: "山田",
        purpose: "受診送迎",
        start_km: 15000,
        end_km: 15020,
        distance_km: 20,
        key_returned: 1,
        notes: "テスト運行"
      };
      assert(newVehicleLog.end_km - newVehicleLog.start_km === newVehicleLog.distance_km, "Test 19: 車両運行メーター走行距離の自動計算が正常");

      // 12. 認印スタンプ機能テスト
      const staffNames = db.data.stamps.map(s => s.name);
      const hasLeader = staffNames.some(n => n.includes("山田"));
      const hasDirector = staffNames.some(n => n.includes("施設長") || n.includes("木村"));
      assert(hasLeader && hasDirector, "Test 20: 認印スタンプ（職員・施設長）が正常保持されていること");

      // 13. UI タブ切り替え関数の存在と動作確認
      assert(typeof switchPortal === "function", "Test 21: switchPortal (現場 ⇄ 事務所) 関数が存在すること");
      assert(typeof switchCareTab === "function", "Test 22: switchCareTab 関数が存在すること");
      assert(typeof switchOfficeTab === "function", "Test 23: switchOfficeTab 関数が存在すること");

      // 14. 月次体重測定と前月比自動計算テスト
      assert(typeof renderWeightTable === "function" && typeof saveWeight === "function", "Test 24: 月次体重測定・保存関数が存在すること");
      const satoPrevWeight = (db.data.weight_records || []).find(w => w.resident_id === 1 && w.month === "2026-08");
      assert(satoPrevWeight && satoPrevWeight.weight === 52.2, "Test 25: 佐藤様の過去体重データ（52.2kg）が保持されていること");

      // 15. 服薬・口腔ケア・日付ジャンプ・シーツ転記テスト
      assert(typeof jumpToDateRecord === "function", "Test 26: 文字検索からの日付ジャンプ関数 (jumpToDateRecord) が存在すること");
      assert(typeof saveMed === "function" && typeof renderMedTable === "function", "Test 27: 服薬完了記録・二重投薬防止機能が存在すること");
      assert(typeof saveOralCare === "function" && typeof renderOralTable === "function", "Test 28: 口腔ケア実施記録・重複防止機能が存在すること");
      assert(typeof saveLinen === "function", "Test 29: シーツ交換記録・個人記録自動転記機能が存在すること");

      // 16. B5用紙1枚分対応・文字数カウンター・全画面エディタ・日報印刷テスト
      assert(typeof updateRecordCharCount === "function", "Test 30: リアルタイム文字数カウンター (updateRecordCharCount) が存在すること");
      assert(typeof insertB5Template === "function", "Test 31: B5日報フォーマット雛形挿入関数 (insertB5Template) が存在すること");
      assert(typeof openFullscreenRecord === "function" && typeof closeFullscreenRecord === "function", "Test 32: 全画面集中エディタ開閉関数 (open/closeFullscreenRecord) が存在すること");
      assert(typeof syncFromFullscreen === "function" && typeof submitCareRecordFromFullscreen === "function", "Test 33: 全画面エディタ双方向同期・保存関数が存在すること");
      assert(typeof printSelectedDateRecords === "function", "Test 34: 本日の記録一覧の日報書類形式印刷関数 (printSelectedDateRecords) が存在すること");
      assert(typeof escapeHtml === "function" && escapeHtml("<scr" + "ipt>'test'&</scr" + "ipt>") === "&lt;script&gt;&#039;test&#039;&amp;&lt;/script&gt;", "Test 35: HTMLエスケープ関数 (escapeHtml) がXSSと特殊記号を正常エスケープすること");

      // B5文字数カウンター計算値の確認
      const area = document.getElementById("recordContent");
      area.value = "あ".repeat(850);
      updateRecordCharCount();
      const badgeText = document.getElementById("recordB5Badge").textContent;
      assert(badgeText.includes("B5用紙1枚適量"), "Test 36: B5目安判定ゲージが850文字で『B5用紙1枚適量』と判定されること");

      // 17. 新改善要件（全16項目関連）の機能・関数完全性テスト
      assert(typeof isCurrentStaffAdmin === "function", "Test 37: 管理者認証判定関数 (isCurrentStaffAdmin) が存在すること");
      assert(typeof renderWeightChart === "function", "Test 38: 月次体重表 1年間SVG折れ線グラフ描画関数 (renderWeightChart) が存在すること");
      assert(Array.isArray(db.data.daily_schedules) && db.data.daily_schedules.length >= 10, "Test 39: 業務日誌日課スケジュール (daily_schedules) が正常保持されていること");
      assert(Array.isArray(db.data.monthly_notices) && db.data.monthly_notices.length >= 2, "Test 40: 月間業務連絡表 (monthly_notices) が正常保持されていること");
      assert(typeof renderOfficeCommittees === "function" && typeof submitCommittee === "function", "Test 41: 法定委員会・研修記録管理関数 (renderOfficeCommittees, submitCommittee) が存在すること");
      assert(typeof toggleNightTurnAction === "function" && typeof submitNightTurnsBatch === "function" && typeof clearAllNightTurnsForDate === "function", "Test 43: 夜間体位変換トグル＆一括確定・一括解除関数が存在すること");
      // 夜間体位変換のチェック全解除テスト (全解除後に復活しないことの検証)
      gState.selectedDate = "2026-10-02";
      initNightTurnDrafts(true);
      const keysBefore = Object.keys(gState.nightTurnDrafts || {});
      keysBefore.forEach(k => {
        const [rId, tm] = k.split("_");
        toggleNightTurnAction(parseInt(rId, 10), tm);
      });
      renderNightTable();
      const keysAfter = Object.keys(gState.nightTurnDrafts || {});
      assert(keysAfter.length === 0, "Test 43b: 夜間体位変換のチェックを全て外しても、外した項目が勝手に復活せず空状態が保持されること");
      // 検証完了後に監査用標準データを再保存
      setNightTurnAction(1, "22:00", "右側臥位");
      setNightTurnAction(2, "22:00", "安眠中");
      setNightTurnAction(1, "00:00", "左側臥位");
      setNightTurnAction(2, "00:00", "安眠中");
      setNightTurnAction(2, "02:00", "左側臥位");
      submitNightTurnsBatch();
      assert(typeof submitGroomingsBatch === "function", "Test 44: 身だしなみ一括確定関数 (submitGroomingsBatch) が存在すること");
      assert(typeof onConsumeResidentChange === "function" && typeof executeConsume === "function", "Test 45: 現場クイック消費枠内利用者同期・確認モーダル関数が存在すること");
      assert(typeof openClinicInstructionModal === "function" && typeof submitClinicInstructions === "function", "Test 46: 往診医・受診時指示＆特殊指示の項目別クイック変更・保存関数が存在すること");
      assert(typeof openCarePlanModal === "function" && typeof openBodyConditionModal === "function", "Test 47: 基本方針・身体状況の項目別クイック変更関数が存在すること");
      assert(typeof dismissAlert === "function" && typeof isAlertDismissed === "function", "Test 48: アラート完了・非表示ディスミス関数 (dismissAlert) が存在すること");
      assert(typeof quickReplenishStock === "function" && typeof quickReplenishAllStock === "function", "Test 49: 在庫補充関数 (quickReplenishStock, quickReplenishAllStock) が内部保持されていること");
      assert(typeof confirmAllMonthlyNoticesForStaff === "function", "Test 50: 月間連絡一括確認完了関数 (confirmAllMonthlyNoticesForStaff) が存在すること");
      assert(typeof adjustOrderQty === "function" && typeof setOrderQtyToNormalDeficit === "function", "Test 51: 発注数量の平常時自動算出＆上下調整機能 (adjustOrderQty, setOrderQtyToNormalDeficit) が存在すること");
      assert(typeof approveOrder === "function" && typeof isCurrentStaffAdmin === "function", "Test 52: 発注申請の個別目視確認・承認機能 (approveOrder) が存在すること (誤認防止・一括承認排除)");
      assert(typeof adjustBelongingQty === "function" && typeof deleteBelonging === "function" && typeof openBelongingModal === "function" && typeof submitBelonging === "function", "Test 53: 私物・持ち込み品台帳の数量増減・編集・削除機能 (adjustBelongingQty, deleteBelonging) が存在すること");
      assert(typeof openEquipmentModal === "function" && typeof submitEquipment === "function" && typeof deleteEquipment === "function" && typeof openFamilyHistoryModal === "function" && typeof submitFamilyHistory === "function", "Test 54: 福祉用具備品追加・解除および緊急連絡先・家族要望・看取り方針変更機能 (submitEquipment, submitFamilyHistory) が存在すること");

      // 18. 月間勤務表・シフト管理 (自動生成・週休2日・夜勤2名・15名体制・同番NG配慮・手動修正) テスト
      assert(typeof generateMonthlyShiftData === "function" && typeof renderShiftTable === "function" && typeof applyShiftCellEdit === "function", "Test 55: 月間勤務表シフト生成・描画・手動修正関数が存在すること");

      // 職員15名体制チェック (施設長1, 看護2, 介護10, 事務2)
      const currentStamps = db.data.stamps || [];
      assert(currentStamps.length >= 15, `Test 56: 職員マスタが健全シフト運用のための15名体制 (管理者1・看護2・介護10・事務2) に増員されていること (現在: ${currentStamps.length}名)`);

      // 2026-10 シフト生成テスト
      const shiftOct = generateMonthlyShiftData("2026-10");
      assert(shiftOct && typeof shiftOct === "object", "Test 57: 2026年10月の1ヶ月分シフトデータが正常に自動生成されること");

      // 施設長・事務員2名・看護師2名は日勤専従＆週休2日 (早・遅・夜に入らない)
      const dayOnlyStaffNames = ["木村 健一", "田中 慎一", "松本 陽子", "鈴木 美智子", "加藤 由美"];
      let allDayOnlyCompliant = true;
      dayOnlyStaffNames.forEach(name => {
        const staffShift = shiftOct[name] || {};
        for (let d = 1; d <= 31; d++) {
          const s = staffShift[d];
          if (s && s !== "日" && s !== "休") allDayOnlyCompliant = false;
        }
      });
      assert(allDayOnlyCompliant, "Test 58: 施設長 (木村 健一)・事務員2名・看護師2名が日勤専従 (『日』または『休』) であり早・遅・夜に絶対入らないこと");

      // 毎日必ず夜勤2名 ＆ 同番NG配慮 (佐藤 健太 ✖ 高橋 直樹 が同一夜勤に入らない)
      let allDaysTwoNights = true;
      let ngPairRespected = true;
      for (let d = 1; d <= 31; d++) {
        let nightStaff = [];
        Object.keys(shiftOct).forEach(staffName => {
          if (shiftOct[staffName][d] === "夜") nightStaff.push(staffName);
        });
        if (nightStaff.length !== 2) allDaysTwoNights = false;
        if (nightStaff.includes("佐藤 健太") && nightStaff.includes("高橋 直樹")) ngPairRespected = false;
        if (nightStaff.includes("佐藤") && nightStaff.includes("高橋")) ngPairRespected = false;
      }
      assert(allDaysTwoNights, "Test 59: 1ヶ月31日間すべての日に夜勤が確実に『毎日2名体制』で配置されていること");
      assert(ngPairRespected, "Test 60: 特例配慮設定 (同番NGペア: 佐藤 健太 ✖ 高橋 直樹) が同日の夜勤に重ならないよう自動回避されること");

      // 手動修正テスト
      gShiftEditingCell = { staffName: "山田 孝之", day: 15, yearMonth: "2026-10" };
      applyShiftCellEdit("休");
      assert(db.data.monthly_shifts["2026-10"]["山田 孝之"][15] === "休", "Test 61: シフト手動修正 (applyShiftCellEdit) が対象セルに即時反映・保存されること");

      // 19. 祝日・年末年始の自動「休（公休）」反映テスト
      const holOct12 = isHolidayOrYearEnd(2026, 10, 12);
      const holDec31 = isHolidayOrYearEnd(2026, 12, 31);
      const holJan1 = isHolidayOrYearEnd(2027, 1, 1);
      const holJan3 = isHolidayOrYearEnd(2027, 1, 3);
      assert(holOct12.isHoliday && holOct12.name === "スポーツの日" && holDec31.isHoliday && holDec31.name === "年末休暇" && holJan1.isHoliday && holJan3.isHoliday, "Test 62: isHolidayOrYearEnd による国民の祝日・年末年始 (12/29〜1/3) の正確な自動判定");

      // 施設長・事務員2名が10月12日(祝日・月曜)に確実に「休」であること
      const kimuraOct12 = shiftOct["木村 健一"] ? shiftOct["木村 健一"][12] : null;
      const tanakaOct12 = shiftOct["田中 慎一"] ? shiftOct["田中 慎一"][12] : null;
      const matsumotoOct12 = shiftOct["松本 陽子"] ? shiftOct["松本 陽子"][12] : null;
      assert(kimuraOct12 === "休" && tanakaOct12 === "休" && matsumotoOct12 === "休", "Test 63: 施設長および事務員2名が祝日 (2026-10-12 スポーツの日) に完全自動で『休』が割り振られていること");

      // 20. セル直下クイック選択ポップオーバー＆ダブルクリック循環切り替えテスト
      assert(typeof openShiftCellPopover === "function" && typeof closeShiftPopover === "function" && typeof executeShiftCellEdit === "function" && typeof cycleShiftCell === "function" && typeof getStaffRoleCategory === "function", "Test 64: シフトセル即時編集ポップオーバー・循環切り替え・職種カテゴリ判定関数が存在すること");
      cycleShiftCell("木村 健一", 1);
      const cycledVal = db.data.monthly_shifts["2026-10"]["木村 健一"][1];
      assert(cycledVal === "日" || cycledVal === "休", "Test 65: 施設長および事務員へのダブルクリック (cycleShiftCell) では『日 ⇄ 休』のみ安全にトグルし夜勤等への誤変更を完全防止すること");

      // 21. 早出1名・遅出1名 毎日完全配置テスト (全31日間)
      let allDaysOneEarly = true;
      let allDaysOneLate = true;
      for (let d = 1; d <= 31; d++) {
        let earlyCount = 0;
        let lateCount = 0;
        Object.keys(shiftOct).forEach(staffName => {
          if (shiftOct[staffName][d] === "早") earlyCount++;
          if (shiftOct[staffName][d] === "遅") lateCount++;
        });
        if (earlyCount !== 1) allDaysOneEarly = false;
        if (lateCount !== 1) allDaysOneLate = false;
      }
      assert(allDaysOneEarly && allDaysOneLate, "Test 66: 1ヶ月31日間すべての日に早出が必ず『毎日1名』、遅出が必ず『毎日1名』厳密に配置されていること");

      // 22. 職種制約ガードテスト (事務員・施設長・看護師への夜勤・早・遅設定の拒絶)
      gShiftEditingCell = { staffName: "田中 慎一", day: 10, yearMonth: "2026-10" };
      const originalTanakaShift = db.data.monthly_shifts["2026-10"]["田中 慎一"][10];
      applyShiftCellEdit("夜"); // 事務員への夜勤設定を試行
      assert(db.data.monthly_shifts["2026-10"]["田中 慎一"][10] === originalTanakaShift, "Test 67: 事務員・施設長・看護師に対する夜勤 (夜) や早出・遅出への手動変更が職種制約ガードにより安全にブロックされること");

      // 23. 総合結果判定
      log("====================================================");
      log(`  全テスト完了: 合計 ${passCount + failCount} 件中 [合格: ${passCount}件, 失敗: ${failCount}件]`);
      log("====================================================");

      const summary = document.getElementById("testSummary");
      if (failCount === 0) {
        summary.innerHTML = `<span style="color:#16a34a;">✅ 全 ${passCount} 項目 すべて合格 (ALL PASS)! バグ・例外なし</span>`;
      } else {
        summary.innerHTML = `<span style="color:#dc2626;">❌ ${failCount} 件のテストが失敗しました</span>`;
      }

      window.TEST_COMPLETED = true;
      window.TEST_RESULTS = { passCount, failCount, logs };
      log("・全検証テストが正常に完了しました", "pass");
    }

    // DOM読み込み直後に即時実行
    if (document.readyState === "complete" || document.readyState === "interactive") {
      setTimeout(runAllTests, 100);
    } else {
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(runAllTests, 100);
      });
    }
  </script>
</body>
