<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <title>Modal Click Verification</title>
 <style>
 body { font-family: sans-serif; padding: 20px; }
 .test-pass { color: green; font-weight: bold; margin: 4px 0; }
 .test-fail { color: red; font-weight: bold; margin: 4px 0; }
 </style>
</head>
<body>
 <h1>Modal Verification</h1>
 <div id="results"></div>
 <iframe id="appFrame" src="http://127.0.0.1:8888/" style="width:1200px; height:800px; border:1px solid #ccc;"></iframe>
 <script>
 const resultsEl = document.getElementById("results");
 function report(name, pass, detail) {
 const d = document.createElement("div");
 d.className = pass ? "test-pass" : "test-fail";
 d.textContent = (pass ? "[PASS] " : "[FAIL] ") + name + (detail ? ": " + detail : "");
 resultsEl.appendChild(d);
 }

 const frame = document.getElementById("appFrame");
 frame.onload = async () => {
 await new Promise(r => setTimeout(r, 1500));
 const doc = frame.contentDocument || frame.contentWindow.document;
 const win = frame.contentWindow;

 try {
 win.selectResident(1);
 await new Promise(r => setTimeout(r, 400));

 // 1. 特殊指示を変更ボタン
 const btnSpecial = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("特殊指示を変更"));
 report("特殊指示変更ボタン存在確認", !!btnSpecial);
 if (btnSpecial) {
 btnSpecial.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("clinicInstructionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("特殊指示変更ボタン クリックでモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("clinicInstructionModal");
 }

 // 2. 指示内容を変更ボタン
 const btnInstructions = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("指示内容を変更"));
 report("指示内容変更ボタン存在確認", !!btnInstructions);
 if (btnInstructions) {
 btnInstructions.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("clinicInstructionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("指示内容変更ボタン クリックでモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("clinicInstructionModal");
 }

 // 3. 予定日を変更ボタン
 const btnDate = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("予定日を変更"));
 report("予定日変更ボタン存在確認", !!btnDate);
 if (btnDate) {
 btnDate.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("clinicInstructionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("予定日変更ボタン クリックでモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("clinicInstructionModal");
 }

 // 4. 受診指示を変更ボタン (サマリー見出し横)
 const btnClinicSummary = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("受診指示を変更"));
 report("受診指示変更(サマリー)ボタン存在確認", !!btnClinicSummary);
 if (btnClinicSummary) {
 btnClinicSummary.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("clinicInstructionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("受診指示変更(サマリー)ボタン クリックでモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("clinicInstructionModal");
 }

 // 5. 身体状況・食形態を変更ボタン
 const btnBody = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("身体状況・食形態を変更"));
 report("身体状況・食形態変更ボタン存在確認", !!btnBody);
 if (btnBody) {
 btnBody.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("bodyConditionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("身体状況・食形態変更ボタン クリックでモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("bodyConditionModal");
 }

 // 6. 病歴を変更ボタン
 const btnDiseaseEdit = Array.from(doc.querySelectorAll("button")).find(b => b.textContent.includes("病歴を変更"));
 report("病歴変更ボタン存在確認", !!btnDiseaseEdit);
 if (btnDiseaseEdit) {
 btnDiseaseEdit.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("bodyConditionModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("病歴変更ボタン クリックで身体状況・病歴モーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");
 win.closeModal("bodyConditionModal");
 }

 // 7. 病歴タグクリック
 const tag = doc.querySelector(".disease-tag");
 report("病歴タグ存在確認", !!tag);
 if (tag) {
 tag.click();
 await new Promise(r => setTimeout(r, 200));
 const m = doc.getElementById("diseaseModal");
 const isOpen = m && win.getComputedStyle(m).display === "flex";
 report("病歴タグ クリックで病歴ガイドモーダル表示", isOpen, m ? win.getComputedStyle(m).display : "要素なし");

 const c = doc.getElementById("diseaseModalContent");
 const hasUnneededBanner = c && c.textContent.includes("介護職が無理な医療判断を行う必要はありません");
 const hasEmergencySection = c && c.textContent.includes("すぐに看護師・医師へ報告する基準");
 const hasSafeCareSection = c && c.textContent.includes("現場介護でしてよい対応・ケア");
 report("病歴ガイド 不要な能書きバナーが完全削除されていること", !hasUnneededBanner);
 report("病歴ガイド すぐに看護師・医師へ報告する基準が明記されていること", hasEmergencySection);
 // 用語リンク (.term-link) の存在確認
 const termLinks = doc.querySelectorAll("#diseaseModalContent .term-link");
 report("病歴ガイド内 専門用語タップリンクの存在確認", termLinks.length > 0, termLinks.length + "件の用語リンクを検出");

 if (termLinks.length > 0) {
 // 最初の用語リンクをクリック
 const firstTerm = termLinks[0];
 const termText = firstTerm.textContent.trim();
 firstTerm.click();
 await new Promise(r => setTimeout(r, 200));

 const termCard = doc.getElementById("termExplainCard");
 const isCardOpen = termCard && win.getComputedStyle(termCard).display !== "none";
 report("専門用語『" + termText + "』タップで解説カードが表示されること", isCardOpen);

 const titleEl = doc.getElementById("termExplainTitle");
 const meaningEl = doc.getElementById("termExplainMeaning");
 const checkpointEl = doc.getElementById("termExplainCheckpoint");
 const badgeEl = doc.getElementById("termExplainUrgencyBadge");

 const hasTitle = titleEl && titleEl.textContent.trim().length > 0;
 const hasMeaning = meaningEl && meaningEl.textContent.trim().length > 0;
 const hasCheckpoint = checkpointEl && checkpointEl.textContent.trim().length > 0;
 const hasBadge = badgeEl && badgeEl.textContent.trim().length > 0;

 report("用語解説カードにタイトル・意味・観察ポイント・緊急度が表示されていること", hasTitle && hasMeaning && hasCheckpoint && hasBadge,
 "用語=" + (titleEl ? titleEl.textContent : "") + ", 緊急度=" + (badgeEl ? badgeEl.textContent : ""));

 // 閉じるボタンの動作確認
 win.closeTermExplanation();
 await new Promise(r => setTimeout(r, 100));
 const isCardClosed = termCard && win.getComputedStyle(termCard).display === "none";
 report("用語解説カードの閉じる処理が正常に動作すること", isCardClosed);
 }

 win.closeModal("diseaseModal");
 }

 // 8. 個人カルテ用カレンダー ナビゲーションの存在・レンダリング確認
 const pCalContainer = doc.getElementById("personalCalendarContainer");
 report("個人カルテ用カレンダー コンテナ存在確認", !!pCalContainer);
 if (pCalContainer) {
 const cells = pCalContainer.querySelectorAll("td");
 report("個人カレンダー内 日付セル描画確認", cells.length >= 28, cells.length + "個のセルを描画");
 }

 // 9. 個人サマリーカード（血圧・体温・体重等）の集約表示確認
 const pSummaryArea = doc.getElementById("personalDailySummaryArea");
 report("個人デイリーサマリーエリア存在確認", !!pSummaryArea);
 if (pSummaryArea) {
 const text = pSummaryArea.textContent;
 const hasBp = text.includes("血圧");
 const hasTemp = text.includes("体温");
 const hasWeight = text.includes("体重");
 const hasMeals = text.includes("食事");
 report("個人サマリーカードに血圧・体温・体重・食事等の全項目が集約表示されていること", hasBp && hasTemp && hasWeight && hasMeals,
 "血圧=" + hasBp + ", 体温=" + hasTemp + ", 体重=" + hasWeight + ", 食事=" + hasMeals);
 }

 // 10. 個人バイタル・体重入力モーダルのオープン・連動確認
 win.openPersonalVitalModal();
 await new Promise(r => setTimeout(r, 200));
 const pvModal = doc.getElementById("personalVitalModal");
 const isPvModalOpen = pvModal && win.getComputedStyle(pvModal).display === "flex";
 report("個人カルテより『＋バイタル・体重を記録/編集』モーダルが開くこと", isPvModalOpen);

 const pvmBpHigher = doc.getElementById("pvmBpHigher");
 const pvmWeight = doc.getElementById("pvmWeight");
 const hasInputs = pvmBpHigher && pvmWeight;
 report("モーダル内に最高血圧・最低血圧・体重等の入力項目が存在すること", hasInputs);

 win.closeModal("personalVitalModal");
 await new Promise(r => setTimeout(r, 100));
 const isPvModalClosed = pvModal && win.getComputedStyle(pvModal).display === "none";
 report("バイタル・体重モーダルが正常に閉じられること", isPvModalClosed);

 // 11. 記録区分クイック選択ボタンの動作確認
 const catBtnTokukan = doc.querySelector('#categoryQuickButtons button[data-cat="特変"]');
 report("記録区分『特変』クイックボタン存在確認", !!catBtnTokukan);
 if (catBtnTokukan) {
 catBtnTokukan.click();
 await new Promise(r => setTimeout(r, 100));
 const catSelect = doc.getElementById("recordCategory");
 const isCategorySelected = catSelect && catSelect.value === "特変";
 const isBtnActive = catBtnTokukan.classList.contains("active");
 report("記録区分『特変』ボタンクリックでセレクト値とアクティブ状態が連動すること", isCategorySelected && isBtnActive,
 "セレクト値=" + (catSelect ? catSelect.value : "") + ", active=" + isBtnActive);

 // 介護に戻す
 win.selectRecordCategory("介護");
 }

 // 12. 業務日誌 特変・申送り・連絡追加 モーダルの動作確認
 win.openDailyJournalAddRecordModal("特変");
 await new Promise(r => setTimeout(r, 200));
 const djModal = doc.getElementById("dailyJournalAddRecordModal");
 const isDjModalOpen = djModal && win.getComputedStyle(djModal).display === "flex";
 report("業務日誌『 ＋特変・申送り・連絡を追加』モーダルが開くこと", isDjModalOpen);

 const djmResidentSelect = doc.getElementById("djmResidentSelect");
 const djmCategorySelect = doc.getElementById("djmCategorySelect");
 const djmContent = doc.getElementById("djmContent");
 report("日誌モーダル内に入居者選択・区分・記録内容が存在すること", !!(djmResidentSelect && djmCategorySelect && djmContent));

 win.closeModal("dailyJournalAddRecordModal");
 await new Promise(r => setTimeout(r, 100));
 const isDjModalClosed = djModal && win.getComputedStyle(djModal).display === "none";
 report("業務日誌モーダルが正常に閉じられること", isDjModalClosed);

 // 13. 希望休・要望登録モーダルの動作確認
 win.openShiftHopeModal();
 await new Promise(r => setTimeout(r, 200));
 const hopeModal = doc.getElementById("shiftHopeModal");
 const isHopeModalOpen = hopeModal && win.getComputedStyle(hopeModal).display === "flex";
 report("希望休・事前要望登録モーダルが開くこと", isHopeModalOpen);

 const hopeStaff = doc.getElementById("shiftHopeStaff");
 const hopeDay = doc.getElementById("shiftHopeDay");
 const hopeReason = doc.getElementById("shiftHopeReason");
 const hopeList = doc.getElementById("shiftHopeList");
 report("希望休モーダル内に対象職員・希望日・理由・一覧が存在すること", !!(hopeStaff && hopeDay && hopeReason && hopeList));

 win.closeModal("shiftHopeModal");
 await new Promise(r => setTimeout(r, 100));
 const isHopeModalClosed = hopeModal && win.getComputedStyle(hopeModal).display === "none";
 report("希望休モーダルが正常に閉じられること", isHopeModalClosed);

 // 14. 本日の勤務体制バーの動的連動確認
 const todayBar = doc.getElementById("todayShiftBar");
 const todayBarText = todayBar ? todayBar.textContent : "";
 const hasDynamicShiftContent = todayBarText.includes("早出") && todayBarText.includes("日勤") && todayBarText.includes("夜勤");
 report("本日の勤務体制バーがシフト表と動的連動し早出・日勤・夜勤等が表示されること", hasDynamicShiftContent, todayBarText.slice(0, 60));

 const fin = document.createElement("div");
 fin.id = "testComplete";
 document.body.appendChild(fin);
 } catch (err) {
 report("テスト実行例外", false, err.message);
 }
 };
 </script>
</body>
</html>
